<!DOCTYPE html>
<html>
<head>
    <title>CDN Upload</title>
</head>
<body>
<h2>CDN Upload Test</h2>
<input id="apikey" placeholder="API Key" style="width:400px">
<br><br>
<input type="file" id="file">
<br><br>
<label>Retention:</label>
<select id="retentionMode">
    <option value="global">Follow Global Setting</option>
    <option value="enabled">Enable Retention</option>
    <option value="disabled">Disable Retention</option>
</select>
<br><br>
<input
    id="retentionDays"
    type="number"
    min="1"
    placeholder="Retention days"
    style="width:200px"
>
<br><br>
<button onclick="upload()">Upload</button>
<hr>
<h2>Delete File</h2>
<input
    id="deleteFile"
    placeholder="example: abc123.mp4"
    style="width:400px"
>
<br><br>
<button onclick="deleteFile()">Delete</button>
<hr>
<h2>Change File Retention</h2>
<input
    id="retentionFile"
    placeholder="example: abc123.mp4"
    style="width:400px"
>
<br><br>
<select id="existingRetentionMode">
    <option value="global">Follow Global Setting</option>
    <option value="enabled">Enable Retention</option>
    <option value="disabled">Disable Retention</option>
</select>
<br><br>
<input
    id="existingRetentionDays"
    type="number"
    min="1"
    placeholder="Retention days"
    style="width:200px"
>
<br><br>
<button onclick="changeRetention()">Update Retention</button>
<hr>
<h2>CDN Health</h2>
<button onclick="checkHealth()">Check Health</button>
<button onclick="checkReady()">Check Readiness</button>
<br><br>
<div id="healthStatus"></div>
<br>
<div id="status"></div>
<progress
    id="progress"
    max="100"
    value="0"
    style="width:500px"
></progress>
<script>
const CDN_URL = "https://cdn.example.com";
async function upload() {
    const file =
        document.getElementById("file")
        .files[0];
    const apiKey =
        document.getElementById("apikey")
        .value;
    if (!file) {
        return alert("Select a file.");
    }
    if (!apiKey) {
        return alert("Enter an API key.");
    }
    const retentionMode =
        document.getElementById("retentionMode")
        .value;
    const form = new FormData();
    form.append("file", file);
    const xhr =
        new XMLHttpRequest();
    xhr.open(
        "POST",
        `${CDN_URL}/upload`
    );
    xhr.setRequestHeader(
        "Authorization",
        "Bearer " + apiKey
    );
    if (retentionMode === "enabled") {
        const days =
            Number(
                document.getElementById(
                    "retentionDays"
                ).value
            );
        if (!Number.isInteger(days) || days < 1) {
            return alert(
                "Enter a valid retention period in days."
            );
        }
        xhr.setRequestHeader(
            "X-Retention-Enabled",
            "true"
        );
        xhr.setRequestHeader(
            "X-Retention-Days",
            String(days)
        );
    } else if (retentionMode === "disabled") {
        xhr.setRequestHeader(
            "X-Retention-Enabled",
            "false"
        );
    }
    xhr.timeout =
        1000 * 60 * 60;
    const startTime =
        Date.now();
    xhr.upload.onprogress = (e) => {
        if (!e.lengthComputable) return;
        const percent =
            Math.round(
                (e.loaded / e.total) * 100
            );
        document.getElementById(
            "progress"
        ).value = percent;
        const elapsed =
            (Date.now() - startTime) / 1000;
        const speed =
            e.loaded /
            elapsed /
            1024 /
            1024;
        const remaining =
            (e.total - e.loaded) /
            (speed * 1024 * 1024);
        document.getElementById(
            "status"
        ).innerHTML = `
            ${percent}%<br>
            ${(e.loaded / 1024 / 1024).toFixed(2)} MB /
            ${(e.total / 1024 / 1024).toFixed(2)} MB<br>
            ${speed.toFixed(2)} MB/s<br>
            ETA:
            ${
                isFinite(remaining)
                    ? remaining.toFixed(1)
                    : "..."
            } sec
        `;
    };
    xhr.onload = () => {
        if (xhr.status !== 200) {
            document.getElementById(
                "status"
            ).innerHTML =
                "❌ Upload failed: " +
                xhr.responseText;
            return;
        }
        const data =
            JSON.parse(
                xhr.responseText
            );
        document.getElementById(
            "status"
        ).innerHTML += `
            <hr>
            ✅ Upload complete!<br>
            File:
            ${data.filename}<br>
            <a
                href="${data.url}"
                target="_blank"
            >
                ${data.url}
            </a>
        `;
    };
    xhr.onerror = () => {
        document.getElementById(
            "status"
        ).innerHTML =
            "❌ Network error (connection dropped)";
    };
    xhr.ontimeout = () => {
        document.getElementById(
            "status"
        ).innerHTML =
            "❌ Upload timed out";
    };
    xhr.send(form);
}
async function deleteFile() {
    const apiKey =
        document.getElementById("apikey")
        .value;
    const fileName =
        document.getElementById("deleteFile")
        .value
        .trim();
    if (!fileName) {
        return alert(
            "Enter a filename."
        );
    }
    document.getElementById(
        "status"
    ).innerHTML =
        "Deleting...";
    try {
        const response =
            await fetch(
                `${CDN_URL}/delete/${encodeURIComponent(fileName)}`,
                {
                    method: "DELETE",
                    headers: {
                        Authorization:
                            "Bearer " + apiKey
                    }
                }
            );
        const data =
            await response.json();
        if (!response.ok) {
            document.getElementById(
                "status"
            ).innerHTML =
                "❌ Delete failed: " +
                (
                    data.error ||
                    "Unknown error"
                );
            return;
        }
        document.getElementById(
            "status"
        ).innerHTML = `
            ✅ ${data.message}
        `;
    } catch (err) {
        document.getElementById(
            "status"
        ).innerHTML =
            "❌ Network error while deleting";
    }
}
async function changeRetention() {
    const apiKey =
        document.getElementById("apikey")
        .value;
    const fileName =
        document.getElementById("retentionFile")
        .value
        .trim();
    const mode =
        document.getElementById(
            "existingRetentionMode"
        ).value;
    if (!fileName) {
        return alert(
            "Enter a filename."
        );
    }
    let body;
    if (mode === "global") {
        body = {
            mode: "global"
        };
    } else if (mode === "enabled") {
        const days =
            Number(
                document.getElementById(
                    "existingRetentionDays"
                ).value
            );
        if (
            !Number.isInteger(days) ||
            days < 1
        ) {
            return alert(
                "Enter a valid retention period in days."
            );
        }
        body = {
            mode: "enabled",
            days: days
        };
    } else {
        body = {
            mode: "disabled"
        };
    }
    document.getElementById(
        "status"
    ).innerHTML =
        "Updating retention...";
    try {
        const response =
            await fetch(
                `${CDN_URL}/retention/${encodeURIComponent(fileName)}`,
                {
                    method: "POST",
                    headers: {
                        "Content-Type":
                            "application/json",
                        Authorization:
                            "Bearer " + apiKey
                    },
                    body:
                        JSON.stringify(body)
                }
            );
        const data =
            await response.json();
        if (!response.ok) {
            document.getElementById(
                "status"
            ).innerHTML =
                "❌ Retention update failed: " +
                (
                    data.error ||
                    "Unknown error"
                );
            return;
        }
        document.getElementById(
            "status"
        ).innerHTML = `
            ✅ Retention updated!<br>
            File: ${fileName}
        `;
    } catch (err) {
        document.getElementById(
            "status"
        ).innerHTML =
            "❌ Network error while updating retention";
    }
}
async function checkHealth() {
    const output =
        document.getElementById(
            "healthStatus"
        );
    output.innerHTML =
        "Checking...";
    try {
        const response =
            await fetch(
                `${CDN_URL}/health`
            );
        const data =
            await response.json();
        if (!response.ok) {
            output.innerHTML =
                "❌ CDN unhealthy";
            return;
        }
        output.innerHTML = `
            ✅ CDN online<br>
            Status: ${data.status}<br>
            Uptime: ${formatUptime(data.uptime)}
        `;
    } catch {
        output.innerHTML =
            "❌ CDN unreachable";
    }
}
async function checkReady() {
    const output =
        document.getElementById(
            "healthStatus"
        );
    output.innerHTML =
        "Checking readiness...";
    try {
        const response =
            await fetch(
                `${CDN_URL}/health/ready`
            );
        const data =
            await response.json();
        if (!response.ok) {
            output.innerHTML = `
                ❌ CDN not ready<br>
                Database: ${data.database || "unknown"}<br>
                Storage: ${data.storage || "unknown"}
            `;
            return;
        }
        output.innerHTML = `
            ✅ CDN ready<br>
            Database: ${data.database}<br>
            Storage: ${data.storage}
        `;
    } catch {
        output.innerHTML =
            "❌ CDN unreachable";
    }
}
function formatUptime(seconds) {
    seconds =
        Math.floor(seconds);
    const days =
        Math.floor(
            seconds / 86400
        );
    seconds %= 86400;
    const hours =
        Math.floor(
            seconds / 3600
        );
    seconds %= 3600;
    const minutes =
        Math.floor(
            seconds / 60
        );
    seconds %= 60;
    return `${days}d ${hours}h ${minutes}m ${seconds}s`;
}
</script>
</body>
</html>
